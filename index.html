<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Kamas%20Stat%22%2C%22short_name%22%3A%22Kamas%20Stat%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230B0E14%22%2C%22theme_color%22%3A%22%230B0E14%22%7D">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#F1F2F5; --border:#E8E9EE;
    --accent:#15171C; --accent-soft:rgba(21,23,28,0.06);
    --text:#14151A; --muted:#8A8F98;
    --gain:#16A34A; --gain-soft:rgba(22,163,74,0.12);
    --loss:#DC2626; --loss-soft:rgba(220,38,38,0.12);
    --shadow:0 1px 2px rgba(20,21,26,0.04), 0 8px 24px rgba(20,21,26,0.06);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); font-family:'Plus Jakarta Sans', sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; }
  .app { max-width:480px; margin:0 auto; background:var(--bg); min-height:100vh; padding-bottom:104px; position:relative; }

  .topbar { display:flex; justify-content:space-between; align-items:center; padding:20px 20px 16px; gap:10px; }
  .topbar h1 { font-size:20px; font-weight:800; margin:0; letter-spacing:-0.3px; flex:1; }
  .chip { font-size:11px; font-weight:600; color:var(--accent); background:var(--accent-soft); padding:5px 10px; border-radius:99px; white-space:nowrap; }
  .icon-btn { width:34px; height:34px; border-radius:10px; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; }

  .toast { position:fixed; top:14px; left:50%; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:99px; z-index:50; box-shadow:0 6px 20px rgba(0,0,0,0.4); }

  .pill-tabs { display:flex; gap:6px; padding:4px 20px 0; }
  .pill-tab { flex:1; text-align:center; padding:9px 0; font-size:13px; font-weight:600; color:var(--muted); background:var(--surface); border-radius:10px; cursor:pointer; }
  .pill-tab.active { color:#fff; background:var(--accent); }

  .period-row { display:flex; gap:6px; padding:12px 20px 0; }
  .period-pill { flex:1; padding:7px 0; text-align:center; font-size:12px; font-weight:600; color:var(--muted); border:1px solid var(--border); border-radius:99px; cursor:pointer; }
  .period-pill.active { border-color:var(--accent); color:var(--accent); }

  .section-title { padding:20px 20px 10px; font-size:13px; font-weight:700; color:var(--text); }
  .section-title span { font-weight:500; color:var(--muted); font-size:12px; }

  .rank-scroll { display:flex; gap:10px; padding:0 20px; overflow-x:auto; }
  .rank-card { min-width:150px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); }
  .rank-card .k { font-size:11px; color:var(--muted); font-weight:600; margin-bottom:8px; }
  .rank-item { display:flex; justify-content:space-between; align-items:center; font-size:12.5px; padding:4px 0; }
  .rank-empty { font-size:11px; color:var(--muted); font-style:italic; }
  .badge { font-size:11px; font-weight:700; padding:2px 7px; border-radius:99px; }
  .badge.up { color:var(--gain); background:var(--gain-soft); }
  .badge.down { color:var(--loss); background:var(--loss-soft); }
  .badge.flat { color:var(--muted); background:var(--surface-2); }

  .card-list { padding:4px 20px 0; display:flex; flex-direction:column; gap:8px; }
  .item-card { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 14px; cursor:pointer; box-shadow:var(--shadow); }
  .avatar { width:38px; height:38px; border-radius:10px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:var(--accent); flex:0 0 auto; }
  .item-info { flex:1; min-width:0; }
  .item-name { font-size:14px; font-weight:700; }
  .item-meta { font-size:11px; color:var(--muted); margin-top:2px; }
  .item-spark { flex:0 0 auto; }
  .item-trailing { text-align:right; flex:0 0 auto; }
  .item-price { font-size:14px; font-weight:800; }

  .empty-state { padding:40px 20px; text-align:center; color:var(--muted); font-size:13px; }

  .fab { position:fixed; right:calc(50% - 240px + 20px); bottom:104px; width:52px; height:52px; border-radius:16px; background:var(--accent); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(20,21,26,0.25); cursor:pointer; z-index:20; }
  @media (max-width:480px) { .fab { right:20px; } }

  .sheet { margin:14px 20px 0; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:16px; box-shadow:var(--shadow); }
  .sheet label { display:block; font-size:11px; font-weight:600; color:var(--muted); margin:12px 0 6px; }
  .sheet label:first-child { margin-top:0; }
  .sheet input, .sheet select { width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:11px 12px; border-radius:11px; font-size:14px; font-family:inherit; }
  .seg { display:flex; gap:8px; }
  .seg div { flex:1; text-align:center; padding:9px 0; border-radius:11px; background:var(--surface-2); font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; }
  .seg div.sel { background:var(--accent); color:#fff; }
  .btn-primary { margin-top:16px; width:100%; padding:13px; background:var(--accent); color:#fff; border:none; border-radius:12px; font-weight:700; font-size:14px; cursor:pointer; }
  .btn-ghost { width:100%; padding:11px; background:transparent; border:none; color:var(--loss); font-size:12px; font-weight:600; cursor:pointer; }
  .btn-secondary { width:100%; padding:11px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-size:13px; font-weight:600; border-radius:11px; cursor:pointer; }

  .detail-head { padding:8px 20px 0; }
  .back-btn { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; font-weight:600; padding:14px 20px 0; cursor:pointer; }
  .detail-title { font-size:24px; font-weight:800; margin:12px 0 2px; letter-spacing:-0.4px; }
  .detail-sub { font-size:12.5px; color:var(--muted); margin-bottom:16px; }

  .stat-row { display:flex; gap:8px; padding:0 20px; }
  .stat { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 8px; text-align:center; box-shadow:var(--shadow); }
  .stat .v { font-size:16px; font-weight:800; }
  .stat .l { font-size:10px; color:var(--muted); margin-top:3px; font-weight:600; }

  .chart-card { margin:14px 20px 0; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 12px; box-shadow:var(--shadow); }

  .ing-list { margin:14px 20px 0; background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); }
  .ing-row { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); font-size:13.5px; }
  .ing-row:last-child { border-bottom:none; }
  .ing-row.total { background:var(--surface-2); font-weight:800; }
  .ing-row .qty-tag { color:var(--muted); font-size:12px; font-weight:600; margin-left:6px; }
  .warn-text { color:var(--loss); font-size:11px; font-weight:600; }

  .margin-card { margin:14px 20px 0; background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); }
  .margin-row { display:flex; justify-content:space-between; padding:11px 16px; font-size:13px; border-bottom:1px solid var(--border); color:var(--muted); }
  .margin-row:last-child { border-bottom:none; }
  .margin-row.result { background:var(--surface-2); color:var(--text); font-weight:800; font-size:14.5px; }

  .add-ing-row { display:flex; gap:8px; margin-top:10px; }
  .add-ing-row select { flex:2; } .add-ing-row input { flex:1; }
  .add-ing-btn { flex:0 0 44px; background:var(--accent); border:none; color:#fff; border-radius:11px; font-size:18px; font-weight:700; }
  .remove-x { color:var(--loss); font-size:12px; font-weight:700; cursor:pointer; padding:2px 8px; }

  .history-list { margin:14px 20px 0; background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); }
  .history-row { display:flex; justify-content:space-between; align-items:center; padding:11px 16px; border-bottom:1px solid var(--border); font-size:12.5px; }
  .history-row:last-child { border-bottom:none; }
  .history-date { color:var(--muted); }

  .bottom-nav { position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); width:calc(100% - 40px); max-width:440px; background:var(--surface); border:1px solid var(--border); border-radius:999px; box-shadow:0 10px 30px rgba(20,21,26,0.14); display:flex; padding:6px; gap:4px; z-index:15; }

// Un item stocke soit une catégorie simple ('cereales', 'plante', 'ressource_divers'),
// soit une sous-catégorie de Ressource sous la forme 'ressource:aile'
function guessCategory(name) {
  const n = name.trim().toLowerCase();
  for (const key of Object.keys(TOP_CATEGORIES)) {
    if (TOP_CATEGORIES[key].keywords && TOP_CATEGORIES[key].keywords.includes(n)) return key;
  }
  return null;
}
function categoryInfo(key) {
  if (!key) return null;
  if (key.startsWith('ressource:')) {
    const sub = key.slice('ressource:'.length);
    return RESSOURCE_SUBCATEGORIES[sub] || null;
  }
  return TOP_CATEGORIES[key] || null;
}
function categoryTopKey(key) {
  if (!key) return null;
  return key.startsWith('ressource:') ? 'ressource' : key;
}

// Stockage : utilise window.storage si dispo (dans Claude), sinon localStorage (Chrome direct)
const hasWidgetStorage = typeof window.storage !== 'undefined';
async function storageGet(key) {
  if (hasWidgetStorage) {
    try { const res = await window.storage.get(key, false); return res ? res.value : null; } catch (e) { return null; }
  }
  try { return window.localStorage.getItem(key); } catch (e) { return null; }
}
async function storageSet(key, value) {
  if (hasWidgetStorage) {
    try { await window.storage.set(key, value, false); return true; } catch (e) { return false; }
  }
  try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; }
}

function bucketKey(ts, period) {
  const d = new Date(ts);
  if (period === 'heure') return d.toISOString().slice(0, 13);
  if (period === 'jour') return d.toISOString().slice(0, 10);
  const day = (d.getDay() + 6) % 7;
  const monday = new Date(d);
  monday.setDate(d.getDate() - day);
  return monday.toISOString().slice(0, 10);
}
function aggregate(history, period) {
  const buckets = {};
  for (const h of history) buckets[bucketKey(h.ts, period)] = h;
  return Object.entries(buckets).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v]) => ({ bucket:k, price:v.unitPrice }));
}
function variation(series) {
  if (series.length < 2) return { diff:0, pct:0 };
  const last = series[series.length-1].price, prev = series[series.length-2].price;
  const diff = last - prev;
  return { diff, pct: prev!==0 ? (diff/prev)*100 : 0 };
}
function latestUnitPrice(item) {
  if (!item || item.history.length === 0) return null;
  return item.history[item.history.length-1].unitPrice;
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'}) + ' ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}

  const prices = series.map(s=>s.price), min = Math.min(...prices), max = Math.max(...prices), range = max-min||1;
  const w=300, h=110, pad=8;
  const coord = (s,i) => [series.length>1 ? (i/(series.length-1))*(w-pad*2)+pad : w/2, h-pad-((s.price-min)/range)*(h-pad*2)];
  const pts = series.map((s,i)=>coord(s,i).join(',')).join(' ');
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h}>
      <polyline points={pts} fill="none" stroke="#15171C" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" />
      {series.map((s,i)=>{ const [x,y]=coord(s,i); return <circle key={i} cx={x} cy={y} r="3" fill="#15171C" />; })}
    </svg>
  );
}

function useStorage(key) {
  const [data, setData] = useState(null);
  useEffect(() => { (async () => {
    const raw = await storageGet(key);
    setData(raw ? JSON.parse(raw) : {});
  })(); }, [key]);
  async function persist(next) { setData(next); await storageSet(key, JSON.stringify(next)); }
  return [data, persist];
}

// ---------- FAÇADE MARCHÉ ----------
function MarketFacade({ market, setMarket }) {
  const [activeType, setActiveType] = useState('ressource');
  const [period, setPeriod] = useState('jour');
  const [selectedId, setSelectedId] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [fName, setFName] = useState(''); const [fType, setFType] = useState('ressource');
  const [fPack, setFPack] = useState(100); const [fPrice, setFPrice] = useState('');
  const [fCategory, setFCategory] = useState('auto');
  const [fSubCategory, setFSubCategory] = useState('');
  const [activeCategory, setActiveCategory] = useState('toutes');
  const [activeSubCategory, setActiveSubCategory] = useState('toutes');
  const [quickShowForm, setQuickShowForm] = useState(false);
  const [quickPack, setQuickPack] = useState(100);
  const [quickPrice, setQuickPrice] = useState('');

  function addQuickEntry(id) {
    if (!quickPrice) return;
    const next = { ...market };
    const item = { ...next[id] };
    const unitPrice = Number(quickPrice) / quickPack;
    item.history = [...item.history, { ts: new Date().toISOString(), price:Number(quickPrice), packSize:quickPack, unitPrice }];
    next[id] = item;
    setMarket(next);
    setQuickPrice(''); setQuickShowForm(false);
  }

  function addEntry() {
    if (!fName.trim() || !fPrice) return;
    const id = fType + ':' + fName.trim().toLowerCase();
    const next = { ...market };
    let resolvedCategory = null;
    if (fType === 'ressource') {
      if (fCategory === 'auto') resolvedCategory = guessCategory(fName);
      else if (fCategory === 'aucune') resolvedCategory = null;
      else if (fCategory === 'ressource') resolvedCategory = fSubCategory ? ('ressource:' + fSubCategory) : null;
      else resolvedCategory = fCategory;
    }
    const existing = next[id] || { name: fName.trim(), type: fType, category: resolvedCategory, history: [] };
    existing.category = resolvedCategory;
    const unitPrice = Number(fPrice) / fPack;
    existing.history = [...existing.history, { ts: new Date().toISOString(), price:Number(fPrice), packSize:fPack, unitPrice }];
    next[id] = existing; setMarket(next);
    setFName(''); setFPrice(''); setFCategory('auto'); setFSubCategory(''); setShowForm(false);
  }
  function deleteItem(id) { const next = {...market}; delete next[id]; setMarket(next); setSelectedId(null); }
  function deleteHistoryEntry(id, index) {
    const next = { ...market }; const item = { ...next[id] };
    item.history = item.history.filter((_, i) => i !== index);
    if (item.history.length === 0) { delete next[id]; setSelectedId(null); }
    else next[id] = item;
    setMarket(next);
  }

  const list = useMemo(() => {
    if (!market) return [];
    return Object.entries(market)
      .filter(([id,it]) => it.type===activeType)
      .filter(([id,it]) => {
        if (activeCategory==='toutes') return true;
        if (activeCategory==='aucune') return !it.category;
        const top = categoryTopKey(it.category);
        if (top !== activeCategory) return false;
        if (activeCategory==='ressource' && activeSubCategory!=='toutes') return it.category === 'ressource:'+activeSubCategory;
        return true;
      })
      .map(([id,it]) => {
        const series = aggregate(it.history, period); const v = variation(series);
        return { id, ...it, series, ...v, last: it.history[it.history.length-1] };
      });
  }, [market, activeType, activeCategory, activeSubCategory, period]);
  const gainers = useMemo(()=>[...list].filter(i=>i.pct>0).sort((a,b)=>b.pct-a.pct).slice(0,3),[list]);
  const losers = useMemo(()=>[...list].filter(i=>i.pct<0).sort((a,b)=>a.pct-b.pct).slice(0,3),[list]);

  if (market === null) return <div className="empty-state">Chargement...</div>;

  if (selectedId && market[selectedId]) {
    const it = market[selectedId]; const series = aggregate(it.history, period); const v = variation(series);
    const last = it.history[it.history.length-1]; const prices = series.map(s=>s.price);
    return (
      <div>
        <div className="back-btn" onClick={()=>setSelectedId(null)}><IconBack/> Marché</div>
        <div className="detail-head">
          <div className="detail-title">{it.name}</div>
          <div className="detail-sub">{it.category ? categoryInfo(it.category).emoji+' '+categoryInfo(it.category).label : (it.type==='ressource'?'Ressource':'Potion')} · {last.price} k les {last.packSize} · vue par {period}</div>
        </div>
        <div className="stat-row">
          <div className="stat"><div className="v" style={{color:v.diff>0?'#16A34A':v.diff<0?'#DC2626':'#14151A'}}>{v.diff>0?'+':''}{v.pct.toFixed(1)}%</div><div className="l">VARIATION</div></div>
          <div className="stat"><div className="v">{prices.length?Math.min(...prices).toFixed(1):'—'}</div><div className="l">MIN /U</div></div>
          <div className="stat"><div className="v">{prices.length?Math.max(...prices).toFixed(1):'—'}</div><div className="l">MAX /U</div></div>
        </div>
        <div className="chart-card"><BigChart series={series} /></div>

        <div className="fab" onClick={()=>setQuickShowForm(!quickShowForm)}><IconPlus/></div>
        {quickShowForm && (
          <div className="sheet">
            <label>Vendu par lot de</label>
            <div className="seg">{PACK_SIZES.map(p => <div key={p} className={quickPack===p?'sel':''} onClick={()=>setQuickPack(p)}>{p}</div>)}</div>
            <label>Nouveau prix relevé pour ce lot (kamas)</label>
            <input type="number" placeholder="ex: 1000" value={quickPrice} onChange={e=>setQuickPrice(e.target.value)} />
            <button className="btn-primary" onClick={()=>addQuickEntry(selectedId)}>Ajouter ce relevé</button>
          </div>
        )}

        <div className="section-title">Relevés enregistrés</div>
        <div className="history-list">
          {it.history.slice().reverse().map((h, revIdx) => {
            const idx = it.history.length - 1 - revIdx;
            return (

                <span className="history-date">{fmtDate(h.ts)}</span>

      </div>
    );
  }

  return (
    <div>
      <div className="pill-tabs">
        <div className={"pill-tab"+(activeType==='ressource'?' active':'')} onClick={()=>setActiveType('ressource')}>Ressources</div>
        <div className={"pill-tab"+(activeType==='potion'?' active':'')} onClick={()=>setActiveType('potion')}>Potions</div>
      </div>
      {activeType==='ressource' && (
        <>
          <div className="rank-scroll" style={{padding:'12px 20px 0'}}>
            <div className={"period-pill"} style={{background:activeCategory==='toutes'?'var(--accent)':'transparent', color:activeCategory==='toutes'?'#fff':'var(--muted)', borderColor:'var(--border)', whiteSpace:'nowrap', flex:'0 0 auto', padding:'7px 14px'}} onClick={()=>{setActiveCategory('toutes'); setActiveSubCategory('toutes');}}>Toutes</div>
            {Object.entries(TOP_CATEGORIES).map(([key,c]) => (
              <div key={key} className={"period-pill"} style={{background:activeCategory===key?'var(--accent)':'transparent', color:activeCategory===key?'#fff':'var(--muted)', borderColor:'var(--border)', whiteSpace:'nowrap', flex:'0 0 auto', padding:'7px 14px'}} onClick={()=>{setActiveCategory(key); setActiveSubCategory('toutes');}}>{c.emoji} {c.label}</div>
            ))}
          </div>
          {activeCategory==='ressource' && (
            <div className="rank-scroll" style={{padding:'8px 20px 0'}}>
              <div className={"period-pill"} style={{background:activeSubCategory==='toutes'?'var(--accent-soft)':'transparent', color:activeSubCategory==='toutes'?'var(--accent)':'var(--muted)', borderColor:'var(--border)', whiteSpace:'nowrap', flex:'0 0 auto', padding:'6px 12px', fontSize:11.5}} onClick={()=>setActiveSubCategory('toutes')}>Toutes</div>
              {Object.entries(RESSOURCE_SUBCATEGORIES).map(([key,c]) => (
                <div key={key} className={"period-pill"} style={{background:activeSubCategory===key?'var(--accent-soft)':'transparent', color:activeSubCategory===key?'var(--accent)':'var(--muted)', borderColor:'var(--border)', whiteSpace:'nowrap', flex:'0 0 auto', padding:'6px 12px', fontSize:11.5}} onClick={()=>setActiveSubCategory(key)}>{c.emoji} {c.label}</div>
              ))}
            </div>
          )}
        </>
      )}
      <div className="period-row">
        {['heure','jour','semaine'].map(p => <div key={p} className={"period-pill"+(period===p?' active':'')} onClick={()=>setPeriod(p)}>{p[0].toUpperCase()+p.slice(1)}</div>)}
      </div>
      {(gainers.length>0 || losers.length>0) && (
        <>
          <div className="section-title">Opportunités <span>· {period}</span></div>
          <div className="rank-scroll">
            <div className="rank-card"><div className="k">HAUSSES</div>
              {gainers.length===0 && <div className="rank-empty">Rien à signaler</div>}

            </div>
            <div className="rank-card"><div className="k">BAISSES</div>
              {losers.length===0 && <div className="rank-empty">Rien à signaler</div>}
              {losers.map(g => <div className="rank-item" key={g.id} onClick={()=>setSelectedId(g.id)}><span>{g.name}</span><span className="badge down">{g.pct.toFixed(0)}%</span></div>)}
            </div>
          </div>
        </>
      )}
      <div className="section-title">Registre</div>
      <div className="card-list">
        {list.length===0 && <div className="empty-state">Aucune entrée. Touche le bouton + pour ajouter un prix.</div>}
        {list.map(it => (
          <div className="item-card" key={it.id} onClick={()=>setSelectedId(it.id)}>
            <div className="avatar" style={{fontSize: it.category ? 18 : 14}}>{customIconFor(it.name) ? React.createElement(customIconFor(it.name)) : (it.category ? categoryInfo(it.category).emoji : initials(it.name))}</div>
            <div className="item-info"><div className="item-name">{it.name}</div><div className="item-meta">{it.category ? categoryInfo(it.category).label+' · ' : ''}{it.last.price} k / {it.last.packSize}</div></div>
            <div className="item-spark"><Sparkline series={it.series} /></div>
            <div className="item-trailing">
              <div className="item-price">{it.last.unitPrice.toFixed(1)} k</div>

      <div className="fab" onClick={()=>{setShowForm(!showForm); setFType(activeType);}}><IconPlus/></div>

              {fCategory === 'ressource' && (

// ---------- FAÇADE ATELIER ----------
function CraftFacade({ market, crafts, setCrafts }) {
  const [selectedId, setSelectedId] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [fName, setFName] = useState('');
  const [newIngId, setNewIngId] = useState(''); const [newIngQty, setNewIngQty] = useState('');
  const [draftIngredients, setDraftIngredients] = useState([]);
  const [sellPriceInput, setSellPriceInput] = useState('');

  const marketList = useMemo(() => market ? Object.entries(market).map(([id,it])=>({id,...it})) : [], [market]);

  function addIngredientToDraft() {
    if (!newIngId || !newIngQty) return;
    const item = marketList.find(m=>m.id===newIngId); if (!item) return;
    setDraftIngredients([...draftIngredients, { itemId:newIngId, name:item.name, qty:Number(newIngQty) }]);
    setNewIngId(''); setNewIngQty('');
  }
  function removeDraftIngredient(i) { setDraftIngredients(draftIngredients.filter((_,idx)=>idx!==i)); }
  function saveCraft() {
    if (!fName.trim() || draftIngredients.length===0) return;
    const id = 'craft:' + fName.trim().toLowerCase();
    const next = { ...crafts, [id]: { name:fName.trim(), ingredients:draftIngredients, sellHistory:(crafts[id]?.sellHistory||[]) } };
    setCrafts(next); setFName(''); setDraftIngredients([]); setShowForm(false);
  }
  function deleteCraft(id) { const next = {...crafts}; delete next[id]; setCrafts(next); setSelectedId(null); }
  function recordSellPrice(id) {
    if (!sellPriceInput) return;
    const next = { ...crafts }; const c = { ...next[id] };
    c.sellHistory = [...c.sellHistory, { ts:new Date().toISOString(), price:Number(sellPriceInput) }];
    next[id] = c; setCrafts(next); setSellPriceInput('');
  }
  function deleteSellEntry(id, index) {
    const next = { ...crafts }; const c = { ...next[id] };
    c.sellHistory = c.sellHistory.filter((_,i)=>i!==index);
    next[id] = c; setCrafts(next);
  }

  if (crafts === null || market === null) return <div className="empty-state">Chargement...</div>;

  if (selectedId && crafts[selectedId]) {
    const c = crafts[selectedId];
    const breakdown = c.ingredients.map(ing => {
      const item = market[ing.itemId]; const unitPrice = latestUnitPrice(item);
      return { ...ing, unitPrice, subtotal: unitPrice!=null ? unitPrice*ing.qty : null, missing: unitPrice==null };
    });
    const missingAny = breakdown.some(b=>b.missing);
    const craftCost = breakdown.reduce((sum,b)=>sum+(b.subtotal||0),0);
    const lastSell = c.sellHistory[c.sellHistory.length-1];
    const sellPrice = sellPriceInput ? Number(sellPriceInput) : (lastSell ? lastSell.price : null);
    const commission = sellPrice!=null ? sellPrice*COMMISSION : null;
    const netRevenue = sellPrice!=null ? sellPrice-commission : null;
    const margin = netRevenue!=null ? netRevenue-craftCost : null;

    return (
      <div>
        <div className="back-btn" onClick={()=>setSelectedId(null)}><IconBack/> Atelier</div>
        <div className="detail-head">
          <div className="detail-title">{c.name}</div>
          <div className="detail-sub">{c.ingredients.length} ingrédient{c.ingredients.length>1?'s':''}</div>
        </div>

        <div className="section-title">Coût de fabrication</div>
        <div className="ing-list">
          {breakdown.map((b,i) => (
            <div className="ing-row" key={i}><div>{b.name}<span className="qty-tag">×{b.qty}</span></div><div>{b.missing ? <span className="warn-text">non renseigné</span> : `${b.subtotal.toFixed(1)} k`}</div></div>
          ))}
          <div className="ing-row total"><div>Coût total</div><div>{craftCost.toFixed(1)} k</div></div>
        </div>
        {missingAny && <div className="warn-text" style={{padding:'8px 20px'}}>Ajoute d'abord les ingrédients manquants dans le Marché.</div>}

        <div className="section-title">Prix de vente HDV actuel</div>
        <div className="sheet" style={{marginTop:0}}>
          <input type="number" placeholder={lastSell ? `dernier : ${lastSell.price} k` : 'ex: 2500'} value={sellPriceInput} onChange={e=>setSellPriceInput(e.target.value)} />
          <button className="btn-primary" onClick={()=>recordSellPrice(selectedId)}>Enregistrer ce prix</button>
        </div>

        {sellPrice != null && (
          <>
            <div className="section-title">Analyse de marge</div>
            <div className="margin-card">
              <div className="margin-row"><span>Prix de vente HDV</span><span>{sellPrice.toFixed(1)} k</span></div>
              <div className="margin-row"><span>Commission (3%)</span><span>− {commission.toFixed(1)} k</span></div>
              <div className="margin-row"><span>Revenu net</span><span>{netRevenue.toFixed(1)} k</span></div>
              <div className="margin-row"><span>Coût du craft</span><span>− {craftCost.toFixed(1)} k</span></div>
              <div className="margin-row result"><span>{margin>=0?'Bénéfice':'Perte'}</span><span style={{color:margin>=0?'var(--gain)':'var(--loss)'}}>{margin>=0?'+':''}{margin.toFixed(1)} k</span></div>
            </div>
          </>
        )}

        {c.sellHistory.length > 0 && (
          <>
            <div className="section-title">Historique des ventes</div>
            {c.sellHistory.length > 1 && <div className="chart-card"><BigChart series={c.sellHistory.map(h=>({price:h.price}))} /></div>}
            <div className="history-list">
              {c.sellHistory.slice().reverse().map((h, revIdx) => {
                const idx = c.sellHistory.length - 1 - revIdx;
                return (
                  <div className="history-row" key={idx}>
                    <span className="history-date">{fmtDate(h.ts)}</span>
                    <span>{h.price} k</span>
                    <span onClick={()=>deleteSellEntry(selectedId, idx)} style={{cursor:'pointer'}}><IconTrash/></span>
                  </div>
                );
              })}
            </div>
          </>
        )}

        <button className="btn-ghost" onClick={()=>deleteCraft(selectedId)}>Supprimer cette recette</button>
      </div>
    );
  }

  const craftList = Object.entries(crafts).map(([id,c]) => {
    const cost = c.ingredients.reduce((sum,ing) => { const up = latestUnitPrice(market[ing.itemId]); return sum + (up!=null ? up*ing.qty : 0); }, 0);
    const missing = c.ingredients.some(ing => latestUnitPrice(market[ing.itemId]) == null);
    const last = c.sellHistory[c.sellHistory.length-1];
    let margin = null; if (last) margin = (last.price - last.price*COMMISSION) - cost;
    return { id, ...c, cost, missing, last, margin };
  });

  return (
    <div>
      <div className="section-title">Tes recettes</div>
      <div className="card-list">
        {craftList.length===0 && <div className="empty-state">Aucune recette. Touche + pour en créer une.</div>}
        {craftList.map(c => (
          <div className="item-card" key={c.id} onClick={()=>setSelectedId(c.id)}>
            <div className="avatar">{initials(c.name)}</div>
            <div className="item-info"><div className="item-name">{c.name}</div><div className="item-meta">coût : {c.missing?'—':c.cost.toFixed(1)+' k'}</div></div>
            <div className="item-trailing">
              {c.margin != null ? <span className={"badge "+(c.margin>=0?'up':'down')}>{c.margin>=0?'+':''}{c.margin.toFixed(0)} k</span> : <span className="item-meta">pas de vente</span>}
            </div>
          </div>
        ))}
      </div>

      <div className="fab" onClick={()=>setShowForm(!showForm)}><IconPlus/></div>

      {showForm && (
        <div className="sheet">
          <label>Nom de l'objet à crafter</label>
          <input placeholder="ex: Potion Magique" value={fName} onChange={e=>setFName(e.target.value)} />
          <label>Ingrédients</label>
          {draftIngredients.map((ing,i) => (
            <div className="ing-row" key={i}><div>{ing.name}<span className="qty-tag">×{ing.qty}</span></div><span className="remove-x" onClick={()=>removeDraftIngredient(i)}>retirer</span></div>
          ))}
          <div className="add-ing-row">
            <select value={newIngId} onChange={e=>setNewIngId(e.target.value)}>
              <option value="">Choisir...</option>
              {marketList.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
            </select>
            <input type="number" placeholder="qté" value={newIngQty} onChange={e=>setNewIngQty(e.target.value)} />
            <button className="add-ing-btn" onClick={addIngredientToDraft}>+</button>
          </div>
          {marketList.length===0 && <div className="warn-text">Ajoute d'abord des ressources dans le Marché.</div>}
          <button className="btn-primary" onClick={saveCraft}>Enregistrer la recette</button>
        </div>
      )}
    </div>
  );
}

  const balanceHistory = (bank && bank.balanceHistory) || [];
  const holdings = (bank && bank.holdings) || {};
  const marketList = useMemo(() => market ? Object.entries(market).map(([id,it])=>({id,...it})) : [], [market]);

  function addBalance() {
    if (!balanceInput) return;
    setBank({ balanceHistory: [...balanceHistory, { ts: new Date().toISOString(), amount: Number(balanceInput) }], holdings });
    setBalanceInput(''); setShowBalanceForm(false);
  }
  function deleteBalance(index) {
    setBank({ holdings, balanceHistory: balanceHistory.filter((_,i)=>i!==index) });

  function addLot() {
    if (!lotItemId || !lotQty || !lotPrice) return;
    const item = marketList.find(m=>m.id===lotItemId); if (!item) return;
    const nextHoldings = { ...holdings };
    const existing = nextHoldings[lotItemId] || { name: item.name, lots: [] };
    existing.lots = [...existing.lots, { id: Date.now()+'-'+Math.random().toString(36).slice(2,7), ts: new Date().toISOString(), qty: Number(lotQty), unitPrice: Number(lotPrice) }];
    nextHoldings[lotItemId] = existing;
    setBank({ balanceHistory, holdings: nextHoldings });
    setLotItemId(''); setLotQty(''); setLotPrice(''); setShowLotForm(false);
  }
  function deleteLot(itemId, lotId) {
    const nextHoldings = { ...holdings };
    const h = { ...nextHoldings[itemId] };
    h.lots = h.lots.filter(l => l.id !== lotId);
    if (h.lots.length === 0) { delete nextHoldings[itemId]; setSelectedHoldingId(null); }
    else nextHoldings[itemId] = h;
    setBank({ balanceHistory, holdings: nextHoldings });
  }

  const holdingsList = useMemo(() => Object.entries(holdings).map(([id, h]) => {
    const totalQty = h.lots.reduce((s,l)=>s+l.qty,0);
    const totalCost = h.lots.reduce((s,l)=>s+l.qty*l.unitPrice,0);
    const avgCost = totalQty > 0 ? totalCost/totalQty : 0;
    const breakeven = avgCost / (1 - COMMISSION);
    const currentPrice = market ? latestUnitPrice(market[id]) : null;
    const profitPerUnit = currentPrice != null ? (currentPrice * (1 - COMMISSION)) - avgCost : null;
    const totalProfit = profitPerUnit != null ? profitPerUnit * totalQty : null;
    return { id, ...h, totalQty, totalCost, avgCost, breakeven, currentPrice, profitPerUnit, totalProfit };
  }), [holdings, market]);
  const totalStockValue = useMemo(() => holdingsList.reduce((s,h) => s + h.totalCost, 0), [holdingsList]);
